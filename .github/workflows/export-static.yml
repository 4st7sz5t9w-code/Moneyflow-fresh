name: Build split MoneyFlow payload
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build split payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse, gzip, base64, math
          h=Path('index.html').read_text()
          h=re.sub(r'<link rel="manifest"[^>]*>','',h)
          h=re.sub(r'<link rel="apple-touch-icon"[^>]*>','',h)
          h=re.sub(r'<link rel="icon"[^>]*>','',h)
          svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="42" fill="#0d1828"/><path d="M38 112V68l28 25 24-37 18 25 34-29v60" fill="none" stroke="#43d7c8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="142" cy="52" r="8" fill="#60a5fa"/></svg>'
          icon='data:image/svg+xml,'+urllib.parse.quote(svg,safe='')
          h=h.replace('<title>MoneyFlow</title>',f'<link rel="icon" href="{icon}"><link rel="apple-touch-icon" href="{icon}"><title>MoneyFlow</title>')
          h=re.sub(r"if\('serviceWorker' in navigator\)\{navigator\.serviceWorker\.register\([^}]+\}\s*",'',h)
          shim="<script>(function(){document.querySelectorAll('[id]').forEach(function(el){if(!(el.id in window))try{window[el.id]=el}catch(e){}})})();</script>"
          h=h.replace("<script>const U='https://icfpgikggqhddlvhwbht.supabase.co'",shim+"<script>const U='https://icfpgikggqhddlvhwbht.supabase.co'",1)
          h=h.replace("logo.src='./icon-512.png?v=9';authLogo.src='./icon-512.png?v=9';",f"logo.src='{icon}';authLogo.src='{icon}';")
          scripts=[]
          for n in ['addon-v9.js','ui-polish-v10.js','history-mobile-fix.js','history-fix-v15.js','safe-ui-v20.js','chat-enhance-v1.js']:
              p=Path(n)
              if p.exists(): scripts.append('<script>\n'+p.read_text()+'\n</script>')
          h=h.replace('</body>','\n'.join(scripts)+'</body>')
          payload=base64.b64encode(gzip.compress(h.encode('utf-8'),compresslevel=9)).decode('ascii')
          size=5000
          parts=[payload[i:i+size] for i in range(0,len(payload),size)]
          for old in Path('.').glob('payload-part-*.txt'): old.unlink()
          for i,part in enumerate(parts,1): Path(f'payload-part-{i}.txt').write_text(part)
          names=[f'/payload-part-{i}.txt' for i in range(1,len(parts)+1)]
          loader=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b14"><title>MoneyFlow</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body style="margin:0;background:#050b14;color:white;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><div style="min-height:100vh;display:grid;place-items:center">טוען את MoneyFlow…</div><script>(async()=>{{try{{const names={names!r};let s='';for(const n of names){{const r=await fetch(n,{{cache:'no-store'}});if(!r.ok)throw new Error(n+' '+r.status);s+=await r.text()}}const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=pako.ungzip(u,{{to:'string'}});document.open();document.write(html);document.close()}}catch(e){{document.body.innerHTML='<pre style="padding:24px;color:#fb7185;white-space:pre-wrap">'+String(e)+'</pre>'}}}})()</script></body></html>'''
          Path('vercel-index.html').write_text(loader)
          Path('payload-count.txt').write_text(str(len(parts)))
          print('parts',len(parts),'payload',len(payload))
          PY
      - name: Commit split payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-index.html payload-count.txt payload-part-*.txt
          git diff --cached --quiet || git commit -m "[skip ci] Generate split MoneyFlow payload"
          git push
