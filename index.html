<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b14"><title>MoneyFlow</title></head><body style="margin:0;background:#050b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px"><div><div style="font-size:28px;font-weight:900">MoneyFlow</div><div style="opacity:.7;margin-top:8px">טוען את v9…</div></div></div><script>(async()=>{try{const r=await fetch('/v9-notify.gz.b64?v=1',{cache:'no-store'});if(!r.ok)throw new Error('קובץ v9 לא נמצא');const b64=(await r.text()).trim();const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><b>טעינת v9 נכשלה</b><div style="margin-top:8px;opacity:.7">'+e.message+'</div></div>'}})();</script></body></html>
