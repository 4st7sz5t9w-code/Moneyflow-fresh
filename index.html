<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b14"><title>MoneyFlow</title></head><body style="margin:0;background:#050b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px"><div><div style="font-size:28px;font-weight:900">MoneyFlow</div><div style="opacity:.7;margin-top:8px">טוען את v9…</div></div></div><script>(async()=>{try{const r=await fetch('/v9-notify.gz.b64?v=1',{cache:'no-store'});if(!r.ok)throw new Error('קובץ v9 לא נמצא');const b64=(await r.text()).trim();const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);let html=await new Response(stream).text();const addon=`<style>
#goals .mf-goal-card{cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;position:relative;overflow:hidden}
#goals .mf-goal-card:active{transform:scale(.985)}
#goals .mf-goal-card:after{content:'לחץ לפירוט ›';display:block;margin-top:9px;color:#9fb0c4;font-size:12px}
@keyframes mfFade{from{opacity:0}to{opacity:1}}@keyframes mfSlide{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}@keyframes mfRow{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#mfGoalHistory{animation:mfFade .2s ease}.mfGoalSheet{animation:mfSlide .32s cubic-bezier(.22,.8,.2,1)}.mfGoalRow{animation:mfRow .35s ease both}.mfGoalBar{height:8px;background:#192b40;border-radius:999px;overflow:hidden;margin-top:8px}.mfGoalBar i{display:block;height:100%;background:linear-gradient(90deg,#43d7c8,#60a5fa);border-radius:999px}
</style><script>(function(){function money(n){return '₪'+Math.round(+n||0).toLocaleString('he-IL')}function personNet(a,p){return(a||[]).filter(x=>x.person===p).reduce((s,x)=>s+(x.kind==='income'?+x.amount:-x.amount),0)}function openGoal(person){const old=document.getElementById('mfGoalHistory');if(old)old.remove();let rows=[],title='',sub='',goal=0;if(person==='איתי'){goal=+(set.itay_weekly_goal||1779.41);for(let k=0;k<8;k++){const w=ws(-k),v=personNet(w.a,'איתי'),end=new Date(w.d);end.setDate(end.getDate()+6);rows.push({label:w.d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})+'–'+end.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}),value:v,ok:v>=goal})}const ok=rows.filter(x=>x.ok).length;title='איתי · השבועות האחרונים';sub=ok+' מתוך 8 שבועות עמד ביעד';}else{goal=+(set.noa_monthly_goal||7000);for(let k=0;k<6;k++){const m=ms(-k),v=personNet(m.a,'נועה'),d=new Date(),md=new Date(d.getFullYear(),d.getMonth()-k,1);rows.push({label:md.toLocaleDateString('he-IL',{month:'long',year:'numeric'}),value:v,ok:v>=goal})}const ok=rows.filter(x=>x.ok).length;title='נועה · החודשים האחרונים';sub=ok+' מתוך 6 חודשים עמדה ביעד';}const okCount=rows.filter(x=>x.ok).length,pct=Math.round(okCount/rows.length*100);const box=document.createElement('div');box.id='mfGoalHistory';box.style.cssText='position:fixed;inset:0;z-index:10000;background:#050b14f5;backdrop-filter:blur(12px);padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));overflow:auto;color:#f6f8fb';box.innerHTML='<div class="mfGoalSheet" style="max-width:540px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div><div style="font-size:12px;color:#9fb0c4">היסטוריית יעדים</div><h2 style="margin:3px 0 4px;font-size:24px">'+title+'</h2><div style="color:#9fb0c4;font-size:13px">'+sub+'</div></div><button id="mfGoalX" class="btn s">סגור</button></div><div class="c hero" style="margin-top:14px"><div class="row"><div><div class="mut sm">אחוז הצלחה</div><b style="font-size:30px">'+pct+'%</b></div><div style="text-align:left"><div class="mut sm">יעד לתקופה</div><b>'+money(goal)+'</b></div></div><div class="prog"><i style="width:'+pct+'%"></i></div></div>'+rows.map((r,i)=>'<div class="mfGoalRow txn" style="animation-delay:'+(i*45)+'ms;align-items:flex-start"><div style="min-width:0"><b>'+r.label+'</b><div class="sm" style="margin-top:4px;color:'+(r.ok?'#4ade80':'#fb7185')+'">'+(r.ok?'✓ עמד/ה ביעד':'✕ לא עמד/ה ביעד')+'</div><div class="mfGoalBar"><i style="width:'+Math.max(0,Math.min(100,r.value/goal*100))+'%"></i></div></div><div style="text-align:left;min-width:112px"><b class="'+(r.ok?'good':'bad')+'">'+money(r.value)+'</b><div class="mut sm">מתוך '+money(goal)+'</div></div></div>').join('')+'</div>';document.body.appendChild(box);document.getElementById('mfGoalX').onclick=()=>box.remove();box.addEventListener('click',e=>{if(e.target===box)box.remove()})}function hook(){const cards=[...document.querySelectorAll('#goals .c')];for(const p of ['איתי','נועה']){const card=cards.find(c=>{const h=c.querySelector('h2');return h&&h.textContent.trim()===p});if(card&&!card.dataset.goalDirect){card.dataset.goalDirect='1';card.classList.add('mf-goal-card');card.addEventListener('click',e=>{if(e.target.closest('button,input,select'))return;e.preventDefault();e.stopPropagation();openGoal(p)})}}}const oldShow=window.show;window.show=function(v){oldShow(v);if(v==='goals')setTimeout(hook,0)};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',()=>setTimeout(hook,0)):setTimeout(hook,0);new MutationObserver(hook).observe(document.documentElement,{childList:true,subtree:true})})();<\/script>`;html=html.replace('</body>',addon+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><b>טעינת v9 נכשלה</b><div style="margin-top:8px;opacity:.7">'+e.message+'</div></div>'}})();</script></body></html>
