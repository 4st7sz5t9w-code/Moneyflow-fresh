<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b14"><title>MoneyFlow</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body style="margin:0;background:#050b14;color:white;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><div style="min-height:100vh;display:grid;place-items:center">טוען את MoneyFlow…</div><script>(async()=>{try{const r=await fetch('/payload.txt',{cache:'no-store'});if(!r.ok)throw new Error('payload '+r.status);const b=atob((await r.text()).trim());const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const html=pako.ungzip(u,{to:'string'});document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="padding:24px;color:#fb7185;white-space:pre-wrap">'+String(e)+'</pre>'}})()</script></body></html>
